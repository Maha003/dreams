<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كيف تكون معبرًا — دليل الدراسة التفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2416;
  --ink-soft:#5a5240;
  --paper:#faf5e8;
  --paper-raised:#f2ead8;
  --line:#ddd0ae;
  --night:#1c2b45;
  --night-2:#26395a;
  --gold:#b8860f;
  --gold-soft:#e7c766;
  --teal:#2f5d54;
  --teal-soft:#dcece7;
  --rose:#9c4b45;
  --rose-soft:#f3dfda;
  --card-shadow: 0 2px 0 rgba(43,36,22,.06);
  --radius: 4px;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]) {
  @media (prefers-color-scheme: dark){
    --ink:#ece3cd; --ink-soft:#c9bd9e; --paper:#161310; --paper-raised:#1f1b16;
    --line:#3a3228; --gold:#e0b13a; --gold-soft:#e0b13a; --teal-soft:#1d2f2b; --rose-soft:#301f1e;
  }
}
:root[data-theme="dark"]{
  --ink:#ece3cd; --ink-soft:#c9bd9e; --paper:#161310; --paper-raised:#1f1b16;
  --line:#3a3228; --gold:#e0b13a; --gold-soft:#e0b13a; --teal-soft:#1d2f2b; --rose-soft:#301f1e;
}
html,body{height:100%;}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'Tajawal', 'Segoe UI', Tahoma, sans-serif;
  line-height:1.8;
  scroll-padding-top: calc(120px + env(safe-area-inset-top,0px));
}
.quran, .hadith, blockquote{
  font-family:'Amiri', 'Traditional Arabic', serif;
}
a{color:inherit;}

/* ---------- header ---------- */
header.top{
  position:sticky; top:0; z-index:40;
  background:linear-gradient(180deg, var(--night) 0%, var(--night-2) 100%);
  color:#f4ead0;
  padding-top: env(safe-area-inset-top,0px);
  box-shadow:0 2px 14px rgba(0,0,0,.25);
}
.top-inner{max-width:1040px; margin:0 auto; padding:14px 18px 10px;}
.top-row1{display:flex; align-items:center; justify-content:space-between; gap:12px;}
.brand{display:flex; align-items:center; gap:10px;}
.brand .moon{width:30px;height:30px;flex:none;}
.brand h1{font-size:17px; margin:0; font-weight:900; letter-spacing:.2px;}
.brand p{margin:0; font-size:11px; color:#c8b98a;}
.progress-wrap{display:flex; align-items:center; gap:8px; font-size:11px; color:#d8c99a;}
.progress-track{width:74px; height:6px; border-radius:6px; background:rgba(255,255,255,.15); overflow:hidden;}
.progress-fill{height:100%; background:var(--gold-soft); border-radius:6px; transition:width .4s;}
nav.tabs{
  display:flex; gap:6px; overflow-x:auto; padding:10px 0 12px; margin-top:8px;
  border-top:1px solid rgba(255,255,255,.12);
  scrollbar-width:thin;
}
nav.tabs::-webkit-scrollbar{height:5px;}
nav.tabs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25); border-radius:6px;}
.tab-btn{
  flex:none; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
  color:#e8dcb8; padding:7px 13px; border-radius:20px; font-size:12.5px; font-family:inherit;
  cursor:pointer; white-space:nowrap; transition:.15s; display:flex; align-items:center; gap:6px;
}
.tab-btn:hover{background:rgba(255,255,255,.13);}
.tab-btn.active{background:var(--gold-soft); color:#241b06; border-color:var(--gold-soft); font-weight:700;}
.tab-btn .dot{width:6px;height:6px;border-radius:50%;background:#5f7a55;flex:none;}
.tab-btn.done .dot{background:#79c07d;}

/* ---------- layout ---------- */
main{max-width:1040px; margin:0 auto; padding:26px 18px 80px;}
section.panel{display:none; animation:fade .3s ease;}
section.panel.active{display:block;}
@keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

.lesson-head{margin-bottom:22px;}
.eyebrow{color:var(--gold); font-weight:700; font-size:13px;}
h2.lesson-title{font-size:26px; margin:4px 0 8px; font-weight:900;}
.lesson-sub{color:var(--ink-soft); font-size:14.5px; max-width:640px;}

h3.h{font-size:18px; font-weight:900; margin:30px 0 12px; padding-right:12px; border-right:4px solid var(--gold);}
h4.h4{font-size:15.5px; font-weight:700; margin:18px 0 8px; color:var(--teal);}
:root[data-theme="dark"] h4.h4, :root:not([data-theme="light"]) h4.h4{color:#7fbdae;}
@media (prefers-color-scheme: dark){ h4.h4{color:#7fbdae;} }

p{margin:0 0 12px; max-width:680px;}
ul.plain, ol.plain{margin:0 0 14px; padding-right:20px; max-width:680px;}
ul.plain li, ol.plain li{margin-bottom:6px;}

.card{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 18px; margin-bottom:14px; box-shadow:var(--card-shadow);
}
.callout{
  border-right:4px solid var(--teal); background:var(--teal-soft);
  padding:12px 16px; border-radius:3px; margin:14px 0; max-width:680px; font-size:14.5px;
}
.callout.warn{border-color:var(--rose); background:var(--rose-soft);}
.callout b{display:block; margin-bottom:3px; font-size:13px;}

blockquote.quran{
  margin:12px 0; padding:12px 18px; background:var(--paper); border:1px solid var(--gold-soft);
  border-radius:3px; font-size:17px; color:var(--ink); max-width:680px;
}
blockquote.quran cite{display:block; margin-top:6px; font-family:'Tajawal',sans-serif; font-size:11.5px; color:var(--ink-soft); font-style:normal;}
blockquote.hadith{
  margin:12px 0; padding:12px 18px; background:var(--paper); border-right:3px solid var(--rose);
  font-size:15.5px; max-width:680px;
}
blockquote.hadith cite{display:block; margin-top:6px; font-family:'Tajawal',sans-serif; font-size:11.5px; color:var(--ink-soft); font-style:normal;}

/* symbol dictionary */
.dict-toolbar{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
.dict-toolbar input{
  flex:1; min-width:160px; padding:9px 12px; border-radius:20px; border:1px solid var(--line);
  background:var(--paper); color:var(--ink); font-family:inherit; font-size:13.5px;
}
.dict-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:10px;}
.symbol-card{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 14px; box-shadow:var(--card-shadow);
}
.symbol-card .sym{font-weight:900; color:var(--gold); font-size:15.5px; margin-bottom:4px;}
.symbol-card .mean{font-size:13.8px; margin-bottom:6px;}
.symbol-card details summary{font-size:12px; color:var(--teal); cursor:pointer; list-style:none;}
:root[data-theme="dark"] .symbol-card details summary, :root:not([data-theme="light"]) .symbol-card details summary{color:#7fbdae;}
@media (prefers-color-scheme: dark){.symbol-card details summary{color:#7fbdae;}}
.symbol-card details summary::-webkit-details-marker{display:none;}
.symbol-card details summary:before{content:"﴾ الدليل ﴿ "; }
.symbol-card details[open] summary:before{content:"إخفاء الدليل — "; }
.symbol-card details .ev{font-size:13px; margin-top:6px; color:var(--ink-soft);}

/* practice / reveal */
.practice{
  border:1px dashed var(--gold-soft); border-radius:var(--radius); padding:14px 16px; margin:14px 0; max-width:680px;
  background:var(--paper);
}
.practice .dtext{font-family:'Amiri',serif; font-size:17px; margin-bottom:10px;}
.reveal-btn{
  background:var(--teal); color:#fff; border:none; padding:8px 16px; border-radius:20px;
  font-family:inherit; font-size:13px; cursor:pointer; font-weight:700;
}
.reveal-btn:hover{opacity:.88;}
.answer-box{display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-size:14px;}
.answer-box.show{display:block;}
.answer-box .tag{display:inline-block; background:var(--gold-soft); color:#241b06; font-size:11px; font-weight:700; padding:2px 9px; border-radius:12px; margin-left:6px; margin-bottom:6px;}

/* quiz */
.quiz{max-width:680px; margin-top:16px;}
.q-item{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:12px;}
.q-item .qtext{font-weight:700; margin-bottom:10px; font-size:14.5px;}
.q-options{display:flex; flex-direction:column; gap:6px;}
.q-opt{
  display:flex; align-items:center; gap:8px; padding:8px 12px; border:1px solid var(--line);
  border-radius:6px; cursor:pointer; font-size:13.8px; background:var(--paper);
}
.q-opt:hover{border-color:var(--gold);}
.q-opt input{accent-color:var(--gold);}
.q-opt.correct{background:var(--teal-soft); border-color:var(--teal);}
.q-opt.wrong{background:var(--rose-soft); border-color:var(--rose);}
.q-explain{display:none; margin-top:8px; font-size:13px; color:var(--ink-soft); background:var(--paper); padding:8px 12px; border-radius:6px;}
.q-explain.show{display:block;}
.quiz-score{
  display:flex; align-items:center; justify-content:space-between; background:var(--night);
  color:#f4ead0; padding:12px 18px; border-radius:var(--radius); margin-top:16px; font-size:14px; font-weight:700;
}
.quiz-score .num{color:var(--gold-soft); font-size:20px;}
.check-btn{
  background:var(--gold); color:#241b06; border:none; padding:10px 22px; border-radius:22px;
  font-family:inherit; font-weight:900; font-size:14px; cursor:pointer; margin-top:6px;
}
.check-btn:hover{opacity:.9;}

/* diagrams */
.diagram-wrap{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin:16px 0; overflow-x:auto;}
.diagram-wrap svg{display:block; margin:0 auto; max-width:100%; height:auto;}

/* overview roadmap */
.roadmap-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; margin-top:18px;}
.road-card{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); padding:16px;
  cursor:pointer; transition:.15s; box-shadow:var(--card-shadow); position:relative;
}
.road-card:hover{border-color:var(--gold); transform:translateY(-2px);}
.road-card .num{
  width:28px;height:28px;border-radius:50%;background:var(--night); color:var(--gold-soft);
  display:flex; align-items:center; justify-content:center; font-weight:900; font-size:13px; margin-bottom:8px;
}
.road-card h4{margin:0 0 4px; font-size:14.5px; font-weight:900;}
.road-card p{margin:0; font-size:12.5px; color:var(--ink-soft);}
.road-card .check{position:absolute; top:12px; left:12px; color:#3a9a5f; font-size:16px; display:none;}
.road-card.done .check{display:block;}

.footer-nav{display:flex; justify-content:space-between; margin-top:34px; gap:10px; max-width:680px;}
.nav-btn{
  background:var(--paper-raised); border:1px solid var(--line); padding:10px 18px; border-radius:20px;
  font-family:inherit; font-size:13.5px; cursor:pointer; color:var(--ink); font-weight:700;
}
.nav-btn:hover{border-color:var(--gold);}

.mark-done{
  display:inline-flex; align-items:center; gap:6px; background:var(--paper-raised); border:1px solid var(--line);
  padding:8px 16px; border-radius:20px; font-size:13px; cursor:pointer; margin-top:26px; font-family:inherit; color:var(--ink);
}
.mark-done.on{background:var(--teal); color:#fff; border-color:var(--teal);}

::selection{background:var(--gold-soft); color:#241b06;}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="top-row1">
      <div class="brand">
        <svg class="moon" viewBox="0 0 40 40" fill="none"><path d="M23 4a16 16 0 1 0 13 25.6A13 13 0 0 1 23 4Z" fill="#e7c766"/><circle cx="30" cy="10" r="1.6" fill="#e7c766"/><circle cx="33" cy="16" r="1" fill="#e7c766"/></svg>
        <div>
          <h1>كيف تكون معبرًا</h1>
          <p>دليل الدراسة التفاعلي لدورة تعبير الرؤى الصوتية</p>
        </div>
      </div>
      <div class="progress-wrap">
        <span id="progLabel">0 / 9</span>
        <div class="progress-track"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
      </div>
    </div>
    <nav class="tabs" id="tabsNav"></nav>
  </div>
</header>

<main id="app"></main>

<script>
/* ============================================================
   DATA
   ============================================================ */
const LESSONS = [
  {id:"overview", short:"البداية", title:"نظرة عامة على الدورة"},
  {id:"l1", short:"الدرس ١", title:"المقدمة وشروط طالب هذا العلم"},
  {id:"l2", short:"الدرس ٢", title:"خطوات التعبير وأقسام الرؤى"},
  {id:"l3", short:"الدرس ٣", title:"التأويل بدلالة القرآن الكريم"},
  {id:"l4", short:"الدرس ٤", title:"التأويل بدلالة السنة النبوية"},
  {id:"l5", short:"الدرس ٥", title:"التأويل بدلالة معاني الأشياء"},
  {id:"l6", short:"الدرس ٦", title:"الاشتقاق والضد والقلب"},
  {id:"l7", short:"الدرس ٧", title:"الأمثال واللزوم والمآل"},
  {id:"l8", short:"الدرس ٨", title:"مسائل شرعية هامة"},
  {id:"final", short:"الاختبار الشامل", title:"اختبار شامل نهائي"}
];

const SYM_QURAN = [
 {s:"السيارة", m:"المسافرون، أو قافلة السفر", e:"﴿أُحِلَّ لَكُمْ صَيْدُ الْبَحْرِ وَطَعَامُهُ مَتَاعًا لَكُمْ وَلِلسَّيَّارَةِ﴾ (المائدة: 96) — ﴿وَجَاءَتْ سَيَّارَةٌ فَأَرْسَلُوا وَارِدَهُمْ﴾ (يوسف: 19)"},
 {s:"الحراثة", m:"الزواج والزوجة، أو العمل الصالح، أو المزرعة، أو العقاب والمصيبة، أو الأرض المهيأة للزراعة", e:"﴿نِسَاؤُكُمْ حَرْثٌ لَكُمْ﴾ (البقرة: 223) — ﴿مَنْ كَانَ يُرِيدُ حَرْثَ الْآخِرَةِ نَزِدْ لَهُ فِي حَرْثِهِ﴾ (الشورى: 20) — قصة البقرة في سورة البقرة: 71"},
 {s:"الكلب", m:"الاستفتاء والشك والتخمين، أو أصحاب الصيد، أو العدو، أو الصديق الوفي والحارس الأمين", e:"﴿سَيَقُولُونَ ثَلَاثَةٌ رَابِعُهُمْ كَلْبُهُمْ﴾ (الكهف: 22) — آية الجوارح المعلّمة (المائدة: 4) — ﴿فَمَثَلُهُ كَمَثَلِ الْكَلْبِ﴾ (الأعراف: 176) — ﴿وَكَلْبُهُمْ بَاسِطٌ ذِرَاعَيْهِ﴾ (الكهف: 18)"},
 {s:"المطر", m:"الأذى أو المرض، أو العذاب، أو الحياة والخصب والرحمة، أو الجزاء والعاقبة", e:"﴿إِنْ كَانَ بِكُمْ أَذًى مِنْ مَطَرٍ﴾ (النساء: 102) — ﴿أُمْطِرَتْ مَطَرَ السَّوْءِ﴾ (الفرقان: 40) — ﴿وَأَحْيَيْنَا بِهِ بَلْدَةً مَيْتًا﴾ (ق: 11) — ﴿فَانْظُرْ كَيْفَ كَانَ عَاقِبَةُ الْمُجْرِمِينَ﴾ (الأعراف: 84)"},
 {s:"الهدهد", m:"تفقّد الأحوال والسفر والغياب، أو العلم والخبر اليقين", e:"﴿وَتَفَقَّدَ الطَّيْرَ فَقَالَ مَا لِيَ لَا أَرَى الْهُدْهُدَ﴾ (النمل: 20) — ﴿أَحَطْتُ بِمَا لَمْ تُحِطْ بِهِ وَجِئْتُكَ مِنْ سَبَإٍ بِنَبَإٍ يَقِينٍ﴾ (النمل: 22)"},
 {s:"الجوّال (الهاتف)", m:"خبرٌ ممّن علم ومعرفة، أو كشف المستور، أو انتشار الأخبار، أو سماع خبر عظيم", e:"﴿وَقَدْ أَحَطْنَا بِمَا لَدَيْهِ خُبْرًا﴾ (الكهف: 91) — ﴿يَوْمَئِذٍ تُحَدِّثُ أَخْبَارَهَا﴾ (الزلزلة: 4)"},
 {s:"العسل", m:"نعيم الجنة والعاقبة الحسنة، أو العلاج وشفاء الناس", e:"﴿فِيهَا أَنْهَارٌ مِنْ عَسَلٍ مُصَفًّى﴾ (محمد: 15) — ﴿يَخْرُجُ مِنْ بُطُونِهَا شَرَابٌ مُخْتَلِفٌ أَلْوَانُهُ فِيهِ شِفَاءٌ لِلنَّاسِ﴾ (النحل: 69)"},
 {s:"الذباب", m:"الضعف والعجز", e:"﴿إِنَّ الَّذِينَ تَدْعُونَ مِنْ دُونِ اللَّهِ لَنْ يَخْلُقُوا ذُبَابًا... ضَعُفَ الطَّالِبُ وَالْمَطْلُوبُ﴾ (الحج: 73)"},
 {s:"القطار", m:"الجوانب والنواحي، أو النفاذ والخروج والهروب من الموت", e:"﴿وَلَوْ دُخِلَتْ عَلَيْهِمْ مِنْ أَقْطَارِهَا﴾ (الأحزاب: 14) — ﴿إِنِ اسْتَطَعْتُمْ أَنْ تَنْفُذُوا مِنْ أَقْطَارِ السَّمَاوَاتِ وَالْأَرْضِ﴾ (الرحمن: 33)"},
 {s:"الفتاة الجميلة", m:"زينة الحياة الدنيا (المال والأولاد والأعمال الصالحة)، أو التحذير من الفتنة وحب الشهوات، أو متعة الدنيا ولهوها، أو الجمال والزينة والوجاهة", e:"﴿الْمَالُ وَالْبَنُونَ زِينَةُ الْحَيَاةِ الدُّنْيَا﴾ (الكهف: 46) — ﴿زُيِّنَ لِلنَّاسِ حُبُّ الشَّهَوَاتِ﴾ (آل عمران: 14) — ﴿وَلَكُمْ فِيهَا جَمَالٌ حِينَ تُرِيحُونَ وَحِينَ تَسْرَحُونَ﴾ (النحل: 6)"}
];

const SYM_SUNNAH = [
 {s:"اللبن (الحليب)", m:"العلم والفطرة", e:"رؤيا عمر رضي الله عنه: «بينما أنا نائم أُتيت بقدح لبن فشربت منه... قالوا: فما أوّلته يا رسول الله؟ قال: العلم» (متفق عليه)"},
 {s:"الغراب", m:"الرجل الفاسق", e:"لأن النبي ﷺ سمّى الغراب فاسقًا"},
 {s:"الفأرة", m:"المرأة الفاسقة", e:"لأن النبي ﷺ سمّاها الفويسقة"},
 {s:"القميص", m:"الدين", e:"حديث أبي سعيد الخدري: رؤيا الناس يُعرضون وعليهم قُمُص تبلغ الثدي «فما أوّلته؟ قال: الدين» (البخاري ومسلم) — ﴿وَلِبَاسُ التَّقْوَى ذَلِكَ خَيْرٌ﴾"},
 {s:"السيف", m:"أنصار الرجل الذين يصول بهم", e:"رؤيا النبي ﷺ يوم أُحد: هزّ السيف فانقطع صدره ثم عاد أحسن ما كان"},
 {s:"القيد", m:"الثبات في الدين", e:"«وأُحبّ القيد وأكره الغُلّ، والقيد ثباتٌ في الدين»"},
 {s:"النخلة", m:"بركة المسلم، والمؤمن في أحواله الطيبة الدائمة، والصدقة الجارية", e:"«أخبروني بشجرة تُشبه — أو كالرجل المسلم — لا يتحاتّ ورقها...» فوقع في نفس ابن عمر أنها النخلة (البخاري)"},

 {s:"الموت", m:"التذكير بالتوبة والمغفرة، أو انتهاء الأجل، أو الحَمو (أخو الزوج)، أو السلامة من الفتنة", e:"«أكثروا من ذكر هادم اللذّات» — «الحَمو الموت» — «الموت خيرٌ للمؤمن من الفتنة»"},
 {s:"الزرع", m:"الصدقة، أو الاستكثار من الخيرات، أو السعي والمثابرة", e:"«ما من مسلم يغرس غرسًا... إلا كان له صدقة» (رواه مسلم)"},

 {s:"الذباب", m:"الداء والدواء والشفاء", e:"«إذا وقع الذباب في شراب أحدكم فليغمسه... فإن في أحد جناحيه داء وفي الآخر شفاء»"},
 {s:"الناقة", m:"السباق والمسابقة، أو المجاهد والجهاد في سبيل الله", e:"قصة ناقة النبي ﷺ العضباء التي سُبقت — «فواق ناقة، وجبت له الجنة»"},
 {s:"الأسد", m:"العدوى والتشاؤم والتطيّر، والإصابة بمرض الجذام، والفرار من العدو", e:"«وفِرّ من المجذوم كما تفرّ من الأسد»"}

/* Quiz banks per lesson: {q, opts:[], c:index, ex:explanation} */
const QUIZ = {
 l1:[
  {q:"ما حكم عمل تعبير الرؤى الشرعي كما قرره العلماء؟", opts:["إلهام أو موهبة خاصة ببعض الناس","علم شرعي مكتسب له أصول وقواعد وثوابت","فراسة لا تُكتسب بالتعلّم","نوع من الكهانة المباحة"], c:1, ex:"ذكر ابن السعدي رحمه الله أن عِلم التعبير من العلوم الشرعية، وأن الإنسان يُثاب على تعلّمه وتعليمه؛ وهو مبنيٌّ على أصول من الكتاب والسنة لا على إلهام أو موهبة."},
  {q:"ما حكم بناء أحكام شرعية على الرؤيا؟", opts:["يجوز إذا كانت الرؤيا واضحة","لا يجوز؛ فالرؤيا ظنّ وليست يقينًا","يجوز إذا رآها أكثر من شخص","يجوز فقط للعلماء"], c:1, ex:"من المقدمات المهمة أن تعبير الرؤى ظنّ لا يقين، ولا يُؤخذ منها أحكام شرعية، وإن كانت جزءًا من النبوة وخبرًا عن الغيب."},
  {q:"ماذا نتعلّم من قصة شُريك القاضي مع الخليفة المهدي؟", opts:["أهمية سرعة التعبير دون تروٍّ","خطورة استعبار رؤيا عند معبّر جاهل","أن كل الرؤى يجب أن تُعبَّر فورًا","أن الرؤيا الملكية دائمًا صادقة"], c:1, ex:"استعبر الخليفة عند معبّر جاهل فأمر بقتل إمام بسبب رؤيا، فأنكر عليه شريك ذلك، وفي القصة تحذير من عواقب التعبير الجاهل."}
 ],
 l2:[
  {q:"إلى كم قسم تنقسم الرؤى عند النوم؟", opts:["قسمان: صادقة وكاذبة","ثلاثة أقسام: صادقة، من عمل الشيطان، حديث النفس","أربعة أقسام حسب زمن الرؤيا","خمسة أقسام لا غير"], c:1, ex:"الرؤى ثلاثة أقسام كما ورد عن النبي ﷺ: رؤيا صادقة، ورؤيا من عمل الشيطان، ورؤيا من حديث النفس. وتنقسم الصادقة بدورها إلى: ظاهرة (لا تحتاج تعبيرًا) ومرموزة (تحتاج تعبيرًا)."},
  {q:"ما هو «الرمز» في الرؤيا؟", opts:["كل ما يُذكر في الرؤيا مهما كان","الأمر الغريب المخالف للواقع الذي يحتاج إلى تأويل","اسم الرائي في الرؤيا","تفاصيل زائدة لا معنى لها"], c:1, ex:"الرمز هو الأمر الغريب والمخالف للواقع الذي وقع في الرؤيا ويحتاج إلى تأويل، بخلاف الشاهد الذي لا يحتاج غالبًا إلى تأويل ويدلّ على ارتباط الرؤيا بالواقع، والحشو الذي يُطرح لأنه تخليط لا فائدة فيه."},
  {q:"أين يكون «الشاهد الخارجي» (القرينة)؟", opts:["داخل نص الرؤيا نفسها فقط","خارج الرؤيا؛ في حال الرائي وسؤاله عنه","في كتب التفسير فقط","لا وجود له أصلًا"], c:1, ex:"الشاهد الداخلي يكون داخل نص الرؤيا، أما الشاهد الخارجي (القرينة) فيكون خارجها، ويُعرف بسؤال الرائي مباشرة عن حاله، وبسعة اطلاع المعبّر ومعرفته بأحوال الناس."}
 ],
 l3:[
  {q:"ما القاعدة الأولى والأهم في تعبير الرموز عند مؤلف الدورة؟", opts:["التأويل بدلالة معاني الأشياء","التأويل بدلالة من جهة القرآن الكريم","التأويل بالأمثال السائرة","الاستعانة بأهل الفراسة"], c:1, ex:"استند المعلّم إلى قول ابن القيم رحمه الله إن أمثال القرآن كلها أصول وقواعد لعلم التعبير، وأن أصول التعبير الصحيحة إنما أُخذت من مشكاة القرآن."},
  {q:"في قصة ابن سيرين مع الرجلين اللذين رأيا أنهما يؤذّنان، ما سبب اختلاف التعبير مع اتحاد الرؤيا؟", opts:["اختلاف وقت الرؤيا","اختلاف ظاهر حال كل رجل، فرُبطت الرؤيا بآية تناسب حاله","أن أحدهما كذب في روايته","لا يوجد سبب؛ كان خطأ من ابن سيرين"], c:1, ex:"فسّر ابن سيرين الرؤيا الأولى بآية ﴿أَيَّتُهَا الْعِيرُ إِنَّكُمْ لَسَارِقُونَ﴾ لظهور الشر على الرجل الأول، وفسّر الثانية بآية الحج ﴿وَأَذِّنْ فِي النَّاسِ بِالْحَجِّ﴾ لظهور الصلاح على الثاني — وهذا يبيّن أثر حال الرائي في اختيار وجه التعبير."},
  {q:"بم تُعبَّر «الحراثة» في القرآن حين يكون الرائي أعزب يبحث عن زوجة؟", opts:["بالمرض","بالزوجة، لقوله تعالى ﴿نِسَاؤُكُمْ حَرْثٌ لَكُمْ﴾","بالسفر","بالفقر"], c:1, ex:"الحراثة من الرموز متعددة المعاني في القرآن (الزوجة، العمل الصالح، المزرعة، العقاب...)، واختيار المعنى المناسب يعتمد على حال الرائي والشواهد المحيطة بالرؤيا."}
 ],
 l4:[
  {q:"بم عبّر النبي ﷺ رمز «اللبن» في رؤياه؟", opts:["بالمال","بالعلم","بالسفر","بالمرض"], c:1, ex:"في حديث عمر رضي الله عنه: «أُتيت بقدح لبن فشربت منه... فما أوّلته يا رسول الله؟ قال: العلم» (متفق عليه)."},
  {q:"ما القاعدة المهمة التي ذكرها الدرس بخصوص تكرار الرمز الواحد في رؤى مختلفة؟", opts:["الرمز له معنى واحد ثابت أبدًا في كل رؤيا","تفسير الرمز يختلف باختلاف الرموز الأخرى وحال الرائي والمجتمع","لا يمكن أن يتكرر رمز واحد في رؤيا أخرى","يجب تجاهل الرمز إذا تكرر"], c:1, ex:"نبّه الدرس إلى أن لكل رمز من رموز الرؤيا المتكاملة تفسيرًا مختلفًا في كل رؤيا، وأن اختيار الوجه المناسب يعتمد على رموز الرؤيا الأخرى، وحال الرائي والمجتمع، وتوفيق الله للمعبّر."},
  {q:"بم عُبِّر رمز «القميص» في السنة النبوية؟", opts:["بالمال","بالدين","بالسفر","بالزواج"], c:1, ex:"في حديث أبي سعيد الخدري: رأى الناس يُعرضون وعليهم قُمُص، فسُئل النبي ﷺ عن ذلك فقال: «الدين» (متفق عليه)، وعلّل الحافظ ابن حجر ذلك بأن القميص يستر العورة كما يستر الدين صاحبه."}
 ],
 l5:[
  {q:"ما الذي يميّز قاعدة «التأويل بدلالة معاني الأشياء» عن قاعدتي القرآن والسنة؟", opts:["أنها تحتاج حفظًا دقيقًا لنصوص الوحي","أنها لا تشترط دليلًا نصيًّا؛ بل تعتمد على تأمل المعنى الطبيعي للشيء وفطنة المعبّر","أنها مرفوضة عند جميع العلماء","أنها تقتصر على رموز الحيوانات فقط"], c:1, ex:"هذه القاعدة من أوسع القواعد ولا يلزم فيها أن يكون المعبّر حافظًا للقرآن أو السنة، بل تحتاج إلى ذكاء وفراسة وربط بين معاني الأشياء الطبيعية وحال الرائي."},
  {q:"في رؤيا يوسف عليه السلام، بِمَ فسّر الإمام السعدي الشمسَ؟", opts:["بأبيه","بأمّه","بأخيه الأكبر","بالملك"], c:1, ex:"فسّر السعدي رحمه الله الشمس بالأمّ لأن لفظها مؤنث، والقمرَ بالأب والكواكبَ بالإخوة لأنهما مذكّران، مع مناسبة كون الأصل (الأبوين) أعظم نورًا من الفرع (الإخوة)."},
  {q:"لماذا فُسّرت رؤيا الفتى الذي يعصر خمرًا بأنه سيخرج من السجن ويسقي سيده؟", opts:["لأن الخمر رمز للفرج دائمًا في كل رؤيا","لأن العاصر للخمر يكون في العادة خادمًا لغيره، فتضمّن ذلك خروجه وعودته لخدمة سيده","لأن الخمر محرّم فلا بد أن يدل على شر","لأنه ذكر ذلك صراحة في رؤياه"], c:1, ex:"استنبط ابن سعدي أن من يعصر يكون خادمًا يسقي غيره، فناسب ذلك خروجه من السجن وعودته إلى خدمة الملك؛ وهذا مثال على قاعدة اللزوم المرتبطة بمعاني الأشياء."}
 ],
 l6:[
  {q:"من أي حديث استُنبطت قواعد الاشتقاق والضد والقلب في هذا الدرس؟", opts:["حديث الرؤيا الصالحة جزء من النبوة","حديث «رأيت كأننا في دار عقبة بن رافع، فأُوتينا برطب من رطب ابن طاب»","حديث المؤمن كالنخلة","حديث القيد والغلّ"], c:1, ex:"في هذا الحديث فسّر النبي ﷺ «عقبة» بالعاقبة، و«رافع» بالرفعة، و«دار» بدار الآخرة، و«رطب ابن طاب» بأن دينهم قد طاب؛ فاستُنبطت منه قواعد الاشتقاق والقلب والتصحيف بالمعنى."},
  {q:"ما مثال «الاشتقاق اللغوي» الذي ورد في الدرس؟", opts:["مُبارك يُعبَّر بالبركة، ومرزوق بالرزق، وراشد بالرشد","الفرح يُعبَّر بالبكاء","حَبْل يُعبَّر بحَمْل","عقرب تُقرأ معكوسة برقع"], c:0, ex:"من أمثلة الاشتقاق اللغوي: مبارك ← بركة، مرزوق ← رزق، راشد ← رشد؛ وهذه القاعدة ثابتة بالحديث ولا يصح الاستهزاء بها كما نبّه الدرس."},
  {q:"ما الدليل القرآني على جواز التعبير بالضد (العكس)؟", opts:["﴿فَاسْأَلُوا أَهْلَ الذِّكْرِ﴾","﴿إِذْ يُرِيكَهُمُ اللَّهُ فِي مَنَامِكَ قَلِيلًا وَلَوْ أَرَاكَهُمْ كَثِيرًا لَفَشِلْتُمْ﴾","﴿وَلَقَدْ صَدَقَكُمُ اللَّهُ وَعْدَهُ﴾","﴿إِنَّا أَنْزَلْنَاهُ فِي لَيْلَةِ الْقَدْرِ﴾"], c:1, ex:"أرى الله نبيَّه ﷺ أعداءه في المنام قليلًا مع أنهم في الواقع كثير، تثبيتًا لقلوب المؤمنين؛ فكان هذا تعبيرًا بالضد، وهو من الوجوه الخفية التي لا يطّلع عليها إلا فُذاذ المعبّرين."}
 ],
 l7:[
  {q:"مثل «يداك أوكتا وفوك نفخ» يُضرب لـ...؟", opts:["من نجح في عمله بإتقان","من عمل عملًا ينجو منه ثم قصّر في إبرامه فتسبب في إفساده بنفسه","من سافر بعيدًا عن أهله","من كثر ماله فجأة"], c:1, ex:"أصل المثل أن أعرابيًا نفخ قربة وأوكاها (ربطها) بنفسه، فانحلّ الوكاء فغرق؛ فقيل: يداك أوكتا وفوك نفخ — أي: أنت سبب ما أصابك."},
  {q:"رؤية فتاة أنها حامل، مع كونها غير متزوجة، تُعبَّر بالزواج بأي قاعدة؟", opts:["قاعدة الأمثال السائرة","قاعدة اللزوم؛ لأن الحمل يستلزم الزواج غالبًا","قاعدة القلب والضد","قاعدة التصحيف بالحركات"], c:1, ex:"قاعدة اللزوم تقوم على تعبير الرمز بما يلزم من وقوعه غالبًا؛ فالحمل يستلزم الزواج، ودخول الطبيب يستلزم وجود المرض، وهكذا."},
  {q:"رؤية السحاب في بلد تُعبَّر بالخير والغنى بأي قاعدة؟", opts:["قاعدة المآل؛ لأن السحاب يؤول إلى مطر، والمطر يؤول إلى نبات وخير","قاعدة التقطيع اللفظي","قاعدة القلب","قاعدة اللزوم فقط دون غيرها"], c:0, ex:"قاعدة المآل تنظر إلى ما يؤول إليه الشيء في واقعه: السحاب يؤول إلى مطر، والمطر يؤول إلى نبات وعشب وخير، فيُعبَّر بذلك."}
 ],

const STORE_KEY = "mubarrir_progress_v1";
let state = {visited:{}, quiz:{}};
try{
  const raw = localStorage.getItem(STORE_KEY);
  if(raw) state = JSON.parse(raw);
}catch(e){ /* ignore */ }
function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }

function markVisited(id){ state.visited[id]=true; saveState(); updateProgressUI(); }
function updateProgressUI(){
  const total = LESSONS.length;
  const done = Object.keys(state.visited).length;
  document.getElementById('progLabel').textContent = done+" / "+total;
  document.getElementById('progFill').style.width = Math.round(done/total*100)+"%";
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('done', !!state.visited[b.dataset.id]);
  });
  document.querySelectorAll('.road-card').forEach(c=>{
    c.classList.toggle('done', !!state.visited[c.dataset.id]);
  });
}

function esc(s){return s;}

function renderDict(containerId, data){
  const el = document.getElementById(containerId);
  function draw(list){
    el.innerHTML = list.map(x=>`
      <div class="symbol-card">
        <div class="sym">${x.s}</div>
        <div class="mean">${x.m}</div>
        ${x.e ? `<details><summary></summary><div class="ev">${x.e}</div></details>` : ""}
      </div>`).join("");
  }
  draw(data);
  return draw;
}

function renderPractice(containerId, items){
  const el = document.getElementById(containerId);
  el.innerHTML = items.map((it,idx)=>`
    <div class="practice">
      <div class="dtext">« ${it.d} »</div>
      <button class="reveal-btn" data-target="pr-${containerId}-${idx}">إظهار طريقة التعبير</button>
      <div class="answer-box" id="pr-${containerId}-${idx}">
        ${it.a.map(pair=>`<div style="margin-bottom:6px;"><span class="tag">${pair[0]}</span> ${pair[1]}</div>`).join("")}
      </div>
    </div>`).join("");
  el.querySelectorAll('.reveal-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const box = document.getElementById(b.dataset.target);
      box.classList.toggle('show');
      b.textContent = box.classList.contains('show') ? "إخفاء طريقة التعبير" : "إظهار طريقة التعبير";
    });
  });
}

function renderQuiz(containerId, items, storeKey){
  const el = document.getElementById(containerId);
  el.innerHTML = items.map((q,qi)=>`
    <div class="q-item" data-qi="${qi}">
      <div class="qtext">${qi+1}. ${q.q}</div>
      <div class="q-options">
        ${q.opts.map((op,oi)=>`
          <label class="q-opt">
            <input type="radio" name="${containerId}-q${qi}" value="${oi}">
            <span>${op}</span>
          </label>`).join("")}
      </div>
      <div class="q-explain" id="${containerId}-ex${qi}">${q.ex}</div>
    </div>`).join("") +
    `<button class="check-btn" id="${containerId}-check">تحقق من إجاباتي</button>
     <div class="quiz-score" id="${containerId}-score" style="display:none;">
       <span>نتيجتك في هذا الاختبار</span><span class="num" id="${containerId}-num">0 / ${items.length}</span>
     </div>`;
  document.getElementById(containerId+"-check").addEventListener('click', ()=>{
    let correct = 0;
    items.forEach((q,qi)=>{
      const chosen = el.querySelector(`input[name="${containerId}-q${qi}"]:checked`);
      const opts = el.querySelectorAll(`.q-item[data-qi="${qi}"] .q-opt`);
      opts.forEach((o,oi)=>{
        o.classList.remove('correct','wrong');
        if(oi===q.c) o.classList.add('correct');
        else if(chosen && parseInt(chosen.value)===oi) o.classList.add('wrong');
      });
      document.getElementById(containerId+"-ex"+qi).classList.add('show');
      if(chosen && parseInt(chosen.value)===q.c) correct++;
    });
    document.getElementById(containerId+"-num").textContent = correct+" / "+items.length;
    document.getElementById(containerId+"-score").style.display = "flex";
    if(storeKey){ state.quiz[storeKey] = Math.max(state.quiz[storeKey]||0, correct); saveState(); }
  });
}

const PANEL_FN = {overview:panelOverview,l1:panelL1,l2:panelL2,l3:panelL3,l4:panelL4,l5:panelL5,l6:panelL6,l7:panelL7,l8:panelL8,final:panelFinal};

const app = document.getElementById('app');
LESSONS.forEach(L=>{
  const sec = document.createElement('section');
  sec.className = 'panel';
  sec.id = 'panel-'+L.id;
  sec.innerHTML = PANEL_FN[L.id]();
  app.appendChild(sec);

  // footer nav
  const idx = LESSONS.findIndex(x=>x.id===L.id);
  const prev = LESSONS[idx-1], next = LESSONS[idx+1];
  const footer = document.createElement('div');
  footer.className = 'footer-nav';
  footer.innerHTML = `
    <button class="nav-btn" ${prev?"":"disabled style='visibility:hidden'"} data-nav="${prev?prev.id:''}">${prev? "◂ "+prev.title : ""}</button>
    <button class="nav-btn" ${next?"":"disabled style='visibility:hidden'"} data-nav="${next?next.id:''}">${next? next.title+" ▸" : ""}</button>
  `;
  sec.appendChild(footer);
  footer.querySelectorAll('.nav-btn[data-nav]').forEach(b=>{
    if(b.dataset.nav) b.addEventListener('click', ()=>showPanel(b.dataset.nav));
  });
});

// nav tabs
const tabsNav = document.getElementById('tabsNav');
LESSONS.forEach(L=>{
  const b = document.createElement('button');
  b.className='tab-btn'; b.dataset.id=L.id;
  b.innerHTML = `<span class="dot"></span>${L.short}`;
  b.addEventListener('click', ()=>showPanel(L.id));
  tabsNav.appendChild(b);
});

// overview roadmap cards
const roadGrid = document.getElementById('roadmapGrid');
LESSONS.filter(l=>l.id!=='overview').forEach((L,i)=>{
  const c = document.createElement('div');
  c.className='road-card'; c.dataset.id=L.id;
  c.innerHTML = `<span class="check">✓</span><div class="num">${i+1}</div><h4>${L.title}</h4><p>${L.short}</p>`;
  c.addEventListener('click', ()=>showPanel(L.id));
  roadGrid.appendChild(c);
});

function showPanel(id){
  document.querySelectorAll('section.panel').forEach(s=>s.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.id===id));
  markVisited(id);
  window.scrollTo({top:0, behavior:'smooth'});
  initPanel(id);
}

const INIT_DONE = {};
function initPanel(id){
  if(INIT_DONE[id]) return;
  INIT_DONE[id]=true;
  if(id==='l1'){ renderQuiz('quiz-l1', QUIZ.l1, 'l1'); }
  if(id==='l2'){
    renderPractice('practice-l2', PRACTICE.l2);
    renderQuiz('quiz-l2', QUIZ.l2, 'l2');
  }
  if(id==='l3'){
    const draw = renderDict('dictL3', SYM_QURAN);
    document.getElementById('searchL3').addEventListener('input', (e)=>{
      const q=e.target.value.trim();
      draw(q? SYM_QURAN.filter(x=>x.s.includes(q)||x.m.includes(q)) : SYM_QURAN);
    });
    renderPractice('practice-l3', PRACTICE.l3);
    renderQuiz('quiz-l3', QUIZ.l3, 'l3');
  }
  if(id==='l4'){
    const draw = renderDict('dictL4', SYM_SUNNAH);
    document.getElementById('searchL4').addEventListener('input', (e)=>{
      const q=e.target.value.trim();
      draw(q? SYM_SUNNAH.filter(x=>x.s.includes(q)||x.m.includes(q)) : SYM_SUNNAH);
    });
    renderQuiz('quiz-l4', QUIZ.l4, 'l4');
  }
  if(id==='l5'){
    const draw = renderDict('dictL5', SYM_MEANING);
    document.getElementById('searchL5').addEventListener('input', (e)=>{
      const q=e.target.value.trim();
      draw(q? SYM_MEANING.filter(x=>x.s.includes(q)||x.m.includes(q)) : SYM_MEANING);
    });
    renderPractice('practice-l5', PRACTICE.l5);
    renderQuiz('quiz-l5', QUIZ.l5, 'l5');
  }
  if(id==='l6'){
    renderPractice('practice-l6', PRACTICE.l6);
    renderQuiz('quiz-l6', QUIZ.l6, 'l6');
  }
  if(id==='l7'){
    renderPractice('practice-l7', PRACTICE.l7);
    renderQuiz('quiz-l7', QUIZ.l7, 'l7');
  }
  if(id==='l8'){ renderQuiz('quiz-l8', QUIZ.l8, 'l8'); }
  if(id==='final'){
    const all = [].concat(QUIZ.l1,QUIZ.l2,QUIZ.l3,QUIZ.l4,QUIZ.l5,QUIZ.l6,QUIZ.l7,QUIZ.l8,QUIZ_FINAL_EXTRA);
    // pick a representative subset: 2 from each lesson + all extras, shuffled deterministically
    function pick(arr,n){ return arr.slice(0,n); }
    const subset = [].concat(
      pick(QUIZ.l1,1), pick(QUIZ.l2,2), pick(QUIZ.l3,2), pick(QUIZ.l4,1),
      pick(QUIZ.l5,2), pick(QUIZ.l6,2), pick(QUIZ.l7,2), pick(QUIZ.l8,2),
      QUIZ_FINAL_EXTRA
    );
    renderQuiz('quiz-final', subset, 'final');
  }
}
